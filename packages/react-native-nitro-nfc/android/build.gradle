buildscript {
  ext.NitroNfc = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return NitroNfc[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/nitronfc+autolinking.gradle'

apply plugin: "com.facebook.react"

android {
  namespace "com.margelo.nitro.nitronfc"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  if (rootProject.findProject(":nfc-core") != null) {
    implementation project(":nfc-core")
  } else {
    // Published npm packages carry this release AAR. Keeping the Maven
    // coordinate out of the fallback means a consumer does not need an NFC SDK
    // repository or credentials in its Gradle settings.
    def bundledNfcCore = file("libs/nfc-core.aar")
    if (!bundledNfcCore.isFile()) {
      throw new GradleException(
        "Missing bundled nfc-core.aar. Install a complete react-native-nitro-nfc package " +
          "or run `yarn workspace react-native-nitro-nfc bundle:native` before packing it.",
      )
    }

    implementation files(bundledNfcCore)

    // A local AAR has no POM metadata, so mirror nfc-core's release dependency
    // graph here. Keep the Bouncy Castle modules aligned with the core.
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jmrtd:jmrtd:0.8.6"
    implementation "net.sf.scuba:scuba-sc-android:0.0.26"
    implementation("org.bouncycastle:bcprov-jdk18on") {
      version { strictly "1.84" }
    }
    implementation("org.bouncycastle:bcpkix-jdk18on") {
      version { strictly "1.84" }
    }
    implementation("org.bouncycastle:bcutil-jdk18on") {
      version { strictly "1.84" }
    }
  }
  implementation "androidx.appcompat:appcompat:1.7.0"
}
