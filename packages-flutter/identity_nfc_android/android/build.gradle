group = "com.vppos.nfc.identitynfc"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "2.0.21"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.vppos.nfc.identitynfc"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        implementation("androidx.appcompat:appcompat:1.7.0")
        if (rootProject.findProject(":nfc-core") != null) {
            implementation(project(":nfc-core"))
        } else {
            // The published Flutter package carries this AAR. A local AAR has
            // no POM metadata, so the core's release dependency graph is
            // declared explicitly here.
            def bundledNfcCore = file("libs/nfc-core.aar")
            if (!bundledNfcCore.isFile()) {
                throw new GradleException(
                    "Missing bundled nfc-core.aar. Install a complete identity_nfc_android package " +
                        "or run `yarn flutter:bundle-native` before publishing it."
                )
            }

            implementation(files(bundledNfcCore))
            implementation("androidx.activity:activity-ktx:1.10.1")
            implementation("org.jetbrains.kotlin:kotlin-stdlib")
            implementation("org.jmrtd:jmrtd:0.8.6")
            implementation("net.sf.scuba:scuba-sc-android:0.0.26")
            implementation("org.bouncycastle:bcprov-jdk18on") {
                version { strictly "1.84" }
            }
            implementation("org.bouncycastle:bcpkix-jdk18on") {
                version { strictly "1.84" }
            }
            implementation("org.bouncycastle:bcutil-jdk18on") {
                version { strictly "1.84" }
            }
        }
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
